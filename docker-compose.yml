version: '3.8'

services:
  CondominioSaaS-java:
    build:
      context: .
      dockerfile: Dockerfile
    image: condominiosaas-java:latest
    container_name: CondominioSaaS-java
    restart: unless-stopped
    ports:
      - "${JAVA_HOST_PORT}:${JAVA_CONTAINER_PORT}"
    env_file:
      - .env.prod
    environment:
      # Profile Ativo
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}

      # Banco de dados
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}

      # RabbitMQ
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}

      # JWT
      - APP_JWT_KEY=${APP_JWT_KEY}
      - APP_JWT_ISSUER=${APP_JWT_ISSUER}
      - APP_JWT_AUDIENCE=${APP_JWT_AUDIENCE}
      - APP_JWT_EXPIREMINUTES=${APP_JWT_EXPIREMINUTES}

      # Variáveis extras
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=${MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${JAVA_CONTAINER_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - infra_net

networks:
  infra_net:
    external: true
    name: ${DOCKER_NETWORK}
